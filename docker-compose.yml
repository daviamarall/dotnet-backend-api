services:
  api:
    build: .
    image: dotnet-backend-api:local
    container_name: dotnet-backend-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Data Source=/data/app.db"
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  api-data:
